name: Employment research quality
on:
  push:
    paths:
      - 'data/employment-research.json'
      - 'data/ohio-counties.json'
      - 'ohio.html'
      - 'housing.html'
      - 'data/ohio-support-agencies.json'
      - 'data/ohio-reentry-programs.json'
      - 'data/employer-verification-queue.json'
      - 'docs/PROVIDER-VERIFICATION.md'
      - 'employment.html'
      - 'index.html'
      - 'scripts/validate-employment-data.mjs'
      - 'package.json'
      - 'saved.html'
      - 'assets/saved-leads.js'
      - 'scripts/validate-saved-leads.mjs'
      - 'scripts/validate-account-security.mjs'
      - 'api/account/saved.js'
      - 'api/_lib/auth.js'
      - 'api/account-status.js'
      - 'migrations/002_private_saved_leads.sql'
      - 'src/account-sync.js'
      - 'docs/ACCOUNT-ROLLOUT.md'
      - 'opportunities.html'
      - 'moderation.html'
      - 'src/opportunity-engine.js'
      - 'src/moderation.js'
      - 'src/account-page.js'
      - 'api/opportunities.js'
      - 'api/opportunity-submissions.js'
      - 'api/opportunity-reports.js'
      - 'api/admin/opportunities.js'
      - 'api/account/preferences.js'
      - 'scripts/validate-opportunity-engine.mjs'
      - 'scripts/build-site.mjs'
      - 'neon/migrations/0003_verified_opportunities.sql'
      - 'neon/migrations/0004_moderation_audit.sql'
      - 'neon/migrations/0005_member_preferences.sql'
      - 'neon/seeds/0001_official_ohio_directories.sql'
      - 'tools.html'
      - '.github/workflows/employment-quality.yml'
  pull_request:
    paths:
      - 'data/employment-research.json'
      - 'data/ohio-counties.json'
      - 'ohio.html'
      - 'housing.html'
      - 'data/ohio-support-agencies.json'
      - 'data/ohio-reentry-programs.json'
      - 'data/employer-verification-queue.json'
      - 'docs/PROVIDER-VERIFICATION.md'
      - 'employment.html'
      - 'index.html'
      - 'scripts/validate-employment-data.mjs'
      - 'package.json'
      - 'saved.html'
      - 'assets/saved-leads.js'
      - 'scripts/validate-saved-leads.mjs'
      - 'scripts/validate-account-security.mjs'
      - 'api/account/saved.js'
      - 'api/_lib/auth.js'
      - 'api/account-status.js'
      - 'migrations/002_private_saved_leads.sql'
      - 'src/account-sync.js'
      - 'docs/ACCOUNT-ROLLOUT.md'
      - 'opportunities.html'
      - 'moderation.html'
      - 'src/opportunity-engine.js'
      - 'src/moderation.js'
      - 'src/account-page.js'
      - 'api/opportunities.js'
      - 'api/opportunity-submissions.js'
      - 'api/opportunity-reports.js'
      - 'api/admin/opportunities.js'
      - 'api/account/preferences.js'
      - 'scripts/validate-opportunity-engine.mjs'
      - 'scripts/build-site.mjs'
      - 'neon/migrations/0003_verified_opportunities.sql'
      - 'neon/migrations/0004_moderation_audit.sql'
      - 'neon/migrations/0005_member_preferences.sql'
      - 'neon/seeds/0001_official_ohio_directories.sql'
      - 'tools.html'
      - '.github/workflows/employment-quality.yml'
permissions:
  contents: read
jobs:
  verify-research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate evidence and waiting-period rules
        run: npm run check
