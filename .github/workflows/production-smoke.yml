name: SuccessfulFelons production smoke tests
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser scripts and tool interfaces
        run: node scripts/check-ui.mjs
      - name: Test live production endpoints
        run: node scripts/smoke-test.mjs https://successfulfelons.vercel.app
